# Lint + tests on every push to main and every pull request (phase 8, test-only CI: ADR-011).
# Same Docker image as local dev, aligned on Databricks. Tests that need the Kaggle CSVs (not in Git) skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image
        run: docker compose build
      - name: Lint (ruff)
        run: docker compose run --rm -T dev ruff check .
      - name: Tests (pytest, local Spark + Delta)
        run: docker compose run --rm -T dev pytest -q
