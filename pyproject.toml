[project]
name = "olist"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Explicit rules, so a ruff upgrade cannot change what CI checks: pyflakes + core pycodestyle errors + import order.
select = ["E4", "E7", "E9", "F", "I"]
